<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Launch GitHub Project release flow</title>
  <desc id="desc">A flow from audit to classification, evidence, packaging, and explicit remote handoff.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#F24B22"/></marker>
    <style>.box{fill:#fff;stroke:#D8DEE9;stroke-width:2}.hot{fill:#FFF3E8;stroke:#F24B22;stroke-width:2}.t{font:600 23px system-ui,sans-serif;fill:#162033}.s{font:16px system-ui,sans-serif;fill:#516070}.line{stroke:#F24B22;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#F7F9FC"/>
  <text x="60" y="58" class="t">The release surface follows the project and the outcome.</text>
  <g transform="translate(55 115)"><rect class="box" width="190" height="150" rx="18"/><text x="22" y="48" class="t">01 Audit</text><text x="22" y="82" class="s">facts, risks, gaps</text><text x="22" y="110" class="s">read-only first</text></g>
  <line x1="250" y1="190" x2="285" y2="190" class="line"/>
  <g transform="translate(290 115)"><rect class="hot" width="190" height="150" rx="18"/><text x="22" y="48" class="t">02 Classify</text><text x="22" y="82" class="s">software? dataset?</text><text x="22" y="110" class="s">skill? research?</text></g>
  <line x1="485" y1="190" x2="520" y2="190" class="line"/>
  <g transform="translate(525 115)"><rect class="box" width="190" height="150" rx="18"/><text x="22" y="48" class="t">03 Prove</text><text x="22" y="82" class="s">README, examples</text><text x="22" y="110" class="s">checks, evidence</text></g>
  <line x1="720" y1="190" x2="755" y2="190" class="line"/>
  <g transform="translate(760 115)"><rect class="hot" width="190" height="150" rx="18"/><text x="22" y="48" class="t">04 Package</text><text x="22" y="82" class="s">versioned ZIP</text><text x="22" y="110" class="s">no private state</text></g>
  <line x1="955" y1="190" x2="990" y2="190" class="line"/>
  <g transform="translate(995 115)"><rect class="box" width="150" height="150" rx="18"/><text x="18" y="48" class="t">05 Handoff</text><text x="18" y="82" class="s">remote only</text><text x="18" y="110" class="s">with consent</text></g>
</svg>
