name: Validate

on:
  push:
  pull_request:

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python evals/validate_fixtures.py
      - run: python skills/launch-github-project/scripts/check_links.py .
      - run: python skills/launch-github-project/scripts/check_secrets.py .
      - run: python skills/launch-github-project/scripts/review_public_surface.py . --strict
      - run: python skills/launch-github-project/scripts/generate_release_page.py . --check-all
      - name: Build and inspect the actual repository bundle
        run: |
          python skills/launch-github-project/scripts/build_release_bundle.py . --output "$RUNNER_TEMP/launch-github-project.zip"
          unzip -t "$RUNNER_TEMP/launch-github-project.zip"
          mkdir "$RUNNER_TEMP/release-extract"
          unzip -q "$RUNNER_TEMP/launch-github-project.zip" -d "$RUNNER_TEMP/release-extract"
          if unzip -Z1 "$RUNNER_TEMP/launch-github-project.zip" | grep -Eq '(^|/)\.git(/|$)'; then
            echo "Git metadata entered the release bundle" >&2
            exit 1
          fi
      - run: python -m json.tool .codex-plugin/plugin.json >/dev/null
